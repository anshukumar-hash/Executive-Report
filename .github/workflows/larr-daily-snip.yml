name: Daily LARR Target Summary → Slack

# Posts the Studio Daily Report (gid 68024667) as an image at 06:00 IST.
#
# THE PRIMARY TRIGGER IS EXTERNAL. cron-job.org calls the workflow_dispatch REST
# API at 06:00 IST. The cron windows below are a BACKUP only.
#
# Why: GitHub's scheduler is best-effort and deferred this job by ~4.5 hours
# every day from 14-17 Oct 2026 (00:30 UTC due, 04:50-05:13 actual), landing it
# near 10:30 IST instead of 06:00. That is not tunable from here, and the short
# catch-up windows were sized for a delay of minutes, which was the wrong
# problem. If the external trigger ever dies, these windows still deliver the
# report late rather than not at all.
#
# The gate counts successful runs in a rolling 6h window, so whichever trigger
# fires first wins and the other skips.

on:
  schedule:
    - cron: '30 0 * * *'    # 06:00 IST
    - cron: '50 0 * * *'    # 06:20 IST (catch-up)
    - cron: '10 1 * * *'    # 06:40 IST (catch-up)
  workflow_dispatch: {}

concurrency:
  group: larr-daily-snip
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  snip:
    runs-on: ubuntu-latest
    steps:
      - name: Gate — skip if a snip went out recently
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual runs always post.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A ROLLING WINDOW, NOT THE UTC CALENDAR DAY. 06:00 IST is 00:30 UTC,
          # so a manual post late in the IST evening lands on the PREVIOUS UTC
          # date and the morning run saw a clean slate and posted again minutes
          # later. That duplicate had to be deleted by hand twice. Six hours is
          # long enough to cover the two catch-up windows and a just-sent manual
          # post, short enough that an early-evening send does not suppress the
          # next morning's report.
          CUTOFF=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          CNT=$(gh run list --workflow="larr-daily-snip.yml" --status success --limit 50 \
                  --json createdAt -R "$GITHUB_REPOSITORY" \
                  -q "[.[] | select(.createdAt > \"$CUTOFF\")] | length" 2>/dev/null || echo 0)
          if [ "${CNT:-0}" -gt 0 ]; then
            echo "Posted $CNT time(s) since $CUTOFF — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install poppler + Pillow
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-pil

      - name: Build snip + post to Slack
        if: steps.gate.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL }}
        run: bash larr-snip/report.sh
