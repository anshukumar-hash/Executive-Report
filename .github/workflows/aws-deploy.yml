name: Deploy to AWS (ECS) on aws-prod

# Auto-refresh executive-report.spyne.ai on every change: on each push to the
# aws-prod branch, build the image, push it to ECR, and roll the ECS service.
#
# DORMANT UNTIL CONFIGURED: the job only runs when the repo variable
# AWS_DEPLOY_ENABLED == 'true'. Until DevOps creates the OIDC role and sets the
# variables/secret listed in .github/DEVOPS-AUTODEPLOY.md, pushes are a no-op
# (the job is skipped, not failed).
#
# NOTE: this is an ALTERNATIVE to enabling the native CodePipeline source
# trigger. Use one or the other, not both, or every push builds twice.

on:
  push:
    branches: [aws-prod]
  workflow_dispatch: {}

concurrency:
  group: aws-deploy-ecs
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC (no long-lived keys)
  contents: read

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION:     ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}   # == IMAGE_REPO_NAME used by the pipeline
      ECS_CLUSTER:    ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE:    ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          REPO_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .
          docker push "$REPO_URI:$IMAGE_TAG"
          docker push "$REPO_URI:latest"
          echo "Pushed $REPO_URI:$IMAGE_TAG and :latest"

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          # The ECS task definition must reference the :latest tag for this to
          # pick up the new image. (If it pins a specific tag instead, register a
          # new task-def revision with $IMAGE_TAG and pass it to update-service.)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" >/dev/null
          echo "Triggered ECS rollout for $ECS_SERVICE on $ECS_CLUSTER."

      - name: Wait for the ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "ECS service is stable — executive-report.spyne.ai is on the new image."
